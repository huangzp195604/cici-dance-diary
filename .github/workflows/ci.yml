name: CI

# 之前的唯一工作流只监听 push main，而实际留痕分支是 cloud-snapshot，
# 等于没有拦截。这里覆盖真实推送路径，PR 也一并检查。
on:
  push:
    branches: [cloud-snapshot, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx oxlint src

      - name: Format check
        run: npx prettier --check .

      - name: Build (cloud)
        run: npm run build:cloud
